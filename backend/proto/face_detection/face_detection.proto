syntax = "proto3";

option go_package = "mosaic-client.com/gen/face_detection";

package proto.face_detection;

// Face detection processing service definition
service FaceDetectionService {
    // Send face bytes, get back briefing if known or unknown signal
    rpc ProcessFaces (ProcessFacesRequest) returns (ProcessFacesResponse) {}
    
    // Called after the user enters a name for an unknown face
    rpc RegisterFace (RegisterFaceRequest) returns (RegisterFaceResponse) {}
}

// The request containing the face image in bytes and patient id
message ProcessFacesRequest {
    bytes face_bytes = 1;
    string patient_id = 2;
}

// single face message containing the metadata and if we should register name for it
message FaceResult {                                                                                                                  
    bool is_known = 1;                                                                                                                
    string visitor_id = 2;                                                                                                            
    string briefing = 3;                                                                                                              
    bytes face_embedding = 4; // populated if unknown
}  

// The response containing briefing if face matches an existing face
// or is_known false if face doesnt match
message ProcessFacesResponse {
    bool face_detected = 1; // used so if no face is detected it doesnt send a req
    repeated FaceResult faces = 2;
}

// Response containing data to register a new unknown face
message RegisterFaceRequest {
    bytes face_embedding = 1; // embedding returned from ProcessFace
    string visitor_name = 2;
    string patient_id = 3;
}

// Response containing data about if request succeeded and visitor id
message RegisterFaceResponse {
    bool success = 1;
    string visitor_id = 2;
}