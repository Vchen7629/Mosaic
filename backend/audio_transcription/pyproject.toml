[project]
name = "audio-transcription"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torchaudio>=2.6.0",
    "torch>=2.9.0",
    "pydantic-settings>=2.13.1",
    "numpy>=2.4.3",
    "grpcio>=1.78.0",
    "psycopg-pool>=3.3.0",
    "psycopg>=3.3.3",
    "structlog>=25.5.0",
    "grpcio-health-checking>=1.78.0",
    "prometheus-client>=0.24.1",
    "psutil>=7.0.0",
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "test"]
extraPaths = ["."]

[dependency-groups]
dev = [
    "grpc-stubs>=1.53.0.6",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pyrefly>=0.56.0",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "testcontainers[postgres]>=4.14.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
exclude = [
    "src/gen",
    ".venv",
]

[tool.pyrefly]
project-excludes = ["src/gen/**", "test/**"]
